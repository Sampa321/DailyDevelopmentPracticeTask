<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Range Slider</title>
</head>
<style>
    body{
        background-color: rgb(80, 156, 223);
    }
    .main{
        background-color: white;
        height: 200px;
        width: 400px;
        margin-top: 200px;
        padding-left: 30px;
        padding-right: 30px;
        padding-bottom: 20px;
        padding-top: 20px;
        margin-left: 40%;
        border-radius: 10px;
        border: 2px solid black;
        box-shadow: 5px 5px 5px rgb(16, 41, 63);
    }
    .price-input{
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s;
    }
    .price-input:hover{
        transform: scale(1.05);
    }
    h2{
        text-align: center;
        color: green;
    }
    #range{
        color: green;
         
    }
    label{
        font-size: 17px;
    }
     
    .range-input{
        position: relative;
        padding-left: 25%;
    }
    .range-input input{
        position: absolute;
        width: 50%;
        height: 5px;
        background: none;
        top: -5px;
        pointer-events: none;
    }
    .range-input input::-webkit-slider-thumb{
        pointer-events: auto;
        cursor: pointer;
    }
</style>
<body>
    <div class="main">
        <div class="price-input">
            <div>
                <h2>Price Range Slider</h2><br>
                <label for="Min">Minimum Price </label><input type="number" id="Min" value="2500"><br> <br>
                <label for="Max">Maximum Price </label><input type="number" id="Max" value="8500"><br><br>
            </div>
        </div><br>
        <div class="range-input">
                <input type="range" class="range-min" max="10000" min="0" value="2500">
                <input type="range" class="range-max" max="10000" min="0" value="8500"> 
        </div>
    </div>
</body>
<script>
    let minSlider = document.querySelector(".range-min");
    let maxSlider = document.querySelector(".range-max");
    let minInput = document.getElementById("Min");
    let maxInput = document.getElementById("Max");
    minSlider.oninput = function(){
        if(minSlider.value > maxSlider.value)
        {
            minSlider.value = maxSlider.value;
        }
        minInput.value = minSlider.value;
    }
    maxSlider.oninput = function(){
        if(maxSlider.value<minSlider.value)
        {
            maxSlider.value = minSlider.value;
        }
        maxInput.value = maxSlider.value;
    }
    minInput.oninput = function(){
        minSlider.value = minInput.value;
    }
    maxInput.oninput = function(){
        maxSlider.value = maxInput.value;
    }
</script>
</html>

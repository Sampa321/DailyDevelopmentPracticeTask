<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
</head>
<style>
    body{
        background: radial-gradient(blue,purple);
    }
    .input-group{
        display: flex;
        border-radius: 10px;
        overflow: hidden;
        border: 2px solid black;
        box-shadow: 3px 3px black;
    }
    .input-group:hover{
        padding: 2px;
        border: 2px solid black;
        box-shadow: 3px 3px black;
    }
    .outside{
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 20%;
        
    }
    .inside{
        background-color: white;
        padding: 3%;
        border-radius: 10px;
        border: 2px solid blue;
        box-shadow:10px 10px 15px blue purple ;
    }
    input{
        height: 35px;
        width: 200px;
        color: black;
        font-size: large;
        border: none;
        padding-left: 5px;
    }

    b{
        font-size: 1.5em;
    }
    .addClick{
        background-color: purple;
        color: white;
        height: 40px;
        width: 70px;
        border : none;
         
    }
     
    #addSomething{
        padding-bottom: 5px;
        
    }
</style>
<body>
    <div class="outside">
        <div class="inside">
            <b>To-Do List</b><br><br>
            <div class="input-group">
                <input type="text" id ="addTask" placeholder="Add Your task &rarr;">
                <button class="addClick" onclick="add()" id="addTask2">Add</button>
            </div>
            <div style="display: none;" id="addWritting"></div>
        </div>
    </div>
</body>
<script>
    function add(){
        let value = document.getElementById("addTask").value;
        if(value == "") return;
        let container = document.getElementById("addWritting");
        container.style.display = "block";
        let task = document.createElement("div");
        task.innerHTML = `<button onclick ="markTask(this)" style="border :none;font-size:1.2em">${value}</button>
        <button onclick = "removeTask(this)">❌</button>
        `;

        task.style.display = "flex";
        task.style.justifyContent = "space-between";
        task.style.marginTop = "10px";
        
        container.appendChild(task);
        document.getElementById("addTask").value = "";
    }
    function removeTask(btn) 
    {
        btn.parentElement.remove();
    }
    function markTask(btn)
    {
        btn.innerHTML = `<del>${btn.innerText}</del>`;
    }
</script>
</html>

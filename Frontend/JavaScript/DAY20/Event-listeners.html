<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event - listened</title>
</head>
<body>
    <h1 id="head">Hello World</h1>
    <input type="text" id="in">
</body>
<script>
    function act(){console.log("Event trigeered!!");
    }
    function work(){console.log("Mouse over");
    }
    let head = document.getElementById("head");
    let input = document.getElementById("in");
    head.addEventListener("click",act);
    head.addEventListener("mouseout",act);

    input.addEventListener("change",act)
    input.addEventListener("mouseover",work)
</script>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css using javaScript</title>
</head>
<body>
    
    <div id="head">Hello</div>
</body>
 <script>
    document.getElementById("head").style.backgroundColor = "green";
    let x = document.getElementById("head").style;
    x.fontSize = "1.3em";
    x.padding = "10px";
    x.borderRadius = "10px";
 </script>
</html>

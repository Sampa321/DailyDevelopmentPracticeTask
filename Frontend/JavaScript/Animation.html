<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation 1D</title>
</head>
<style>
    #box{
        height: 100px;
        width: 100px;
        background-color: rgb(8, 8, 66);
        position: absolute;
    }
</style>
<body>
    <button onclick="move()">Move</button>
    <div id="box"></div>
</body>
<script>
    let box = document.getElementById("box");
    function move(){
        let x = 0;
       interval = setInterval(()=>{
            box.style.top = x +"px";
            x += 10;
            if(x > 500) clearInterval(interval)
        },100);
    }
</script>
</html>

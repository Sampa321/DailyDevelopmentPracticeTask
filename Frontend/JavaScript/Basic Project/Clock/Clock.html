<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
</head>
<style>
    body{
        background-color:blueviolet;
    }
    h1{
        text-align: center;
        color: white;
        padding-top: 100px;
        font-size: 3em;
        font-weight: bold;
    }
    .clockBox{
        display: flex;
        align-items: center;
        justify-content: center ;
        height: 100px;
        width: 350px;
        background:linear-gradient(purple);
        color: white;
        margin: 10%;
        margin-left: 40%;
        box-shadow: 5px 5px 5px black;
        border: 2px solid black;
        border-radius: 15px;
        font-size: 1.3em;
    }
    .clockBox:hover{
        padding: 1%;
    }
    #setTimeHour, #setTimeMinit, #setTimeSecond{
        color: white;
        font-size : 1.7em;
        font-weight: bold;
    }
</style>
<body>
    <div>
        <h1>Clock</h1>
        <div class="clockBox">
            <span id="setTimeHour">00</span><b>h</b>&nbsp;: &nbsp;
            <span id="setTimeMinit">00</span><b>m</b>&nbsp;: &nbsp;
            <span id="setTimeSecond">00</span><b>s</b>
        </div>
    </div>
</body>
<script>
    setInterval(()=>{
        let date = new Date();
        document.getElementById("setTimeHour").innerHTML = date.getHours();
        document.getElementById("setTimeMinit").innerHTML = date.getMinutes();
        document.getElementById("setTimeSecond").innerHTML = date.getSeconds();
    },1000)


    document.title = "Clock";
</script>
</html>

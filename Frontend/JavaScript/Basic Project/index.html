<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <script src="ChangeBackgroundColor.js"></script> -->
</head>
<style>
    body{
        display: flex;
        align-items: center;
        justify-content: center;
        height: 80vh;
    }
    #btn{
        background-color: black;
        color: white;
        height: 100px;
        width: 300px;
        border-radius: 20px;
        font-size: x-large;
        box-shadow: 5px 5px 2px black;
        cursor: pointer;
    }
</style>
<body>
    <button id="btn" onclick="update()">Change Background color</button>
</body>
    <script>
        let x =0
        function update(){
            color = ["blue","yellow","purple","red","green"];
            if(x == color.length) x = 0; 
            document.body.style.backgroundColor = color[x++];
        }
    </script>
</html>

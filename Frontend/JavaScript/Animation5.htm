<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation5</title>
</head>
<style>
    body{
        background-color:  rgb(118, 219, 118)
    }
    #box{
        background-color: green;
        height: 150px;
        width: 200px;
        position: absolute;
        top: 250px;
        left: 600px;
        border-radius: 10px;
        border: 2px solid black;
    }
</style>
<body>
    <div id="box"></div>
</body>
<script>
    let box = document.getElementById("box");
    let x = 600;
    let y = 250;
    document.addEventListener("keydown",function(Event)
    {
        switch(Event.key)
        {
            case "ArrowDown" :
                y += 20;
                box.style.top = y +"px"; 
                break;
            case "ArrowUp" :
                y -= 20;
                box.style.top = y +"px"; 
                break;
            case "ArrowLeft" :
                x -= 20;
                box.style.left = x +"px"; 
                break;
            case "ArrowRight" :
                x += 20;
                box.style.left = x +"px"; 
                break;
        }
    }
);
</script>
</html>

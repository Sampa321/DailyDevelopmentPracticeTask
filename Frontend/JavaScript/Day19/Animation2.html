<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation 2D</title>
</head>
<style>
    #box{
        height: 100px;
        width: 100px;
        background-color: rgb(8, 8, 66);
        position: absolute;
        border: 2px solid black;
    }
</style>
<body>
    <button onclick="move()">Move</button>
    <div id="box"></div>
</body>
<script>
    let box = document.getElementById("box");
    function move(){
        let x = 0;
        let y = 0;
        let r = 0;
       interval = setInterval(()=>{
            box.style.top = x +"px";
            box.style.left = y + "px";
            box.style.borderRadius = r +"%";
            x += 10;
            y += 5;
            r +=  r == 50? 0 : 1;
            console.log(x,y);
            
            if(x > 500 && y > 500) clearInterval(interval)
        },100);
    }
</script>
</html>

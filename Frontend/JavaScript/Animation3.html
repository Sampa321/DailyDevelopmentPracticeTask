<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Rotate</title>
</head>
<style>
    #box{
        height: 100px;
        width: 100px;
        background-color: rgb(8, 8, 66);
        position: absolute;
        border: 2px solid black;
        margin : 10px
    }
</style>
<body>
    <button onclick="move()">Move</button>
    <div id="box"></div>
</body>
<script>
    let box = document.getElementById("box");
    function move(){
            let angle = 0;
            interval = setInterval(() =>{
                box.style.transform = "rotateZ("+angle+"deg)";
                angle += 10;
                if(angle == 200) clearInterval(interval)
        },100);
    }
</script>
</html>

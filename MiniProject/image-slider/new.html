<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>changes picture</title>
</head>
<style>
    body{
        width: 80vw;
    }
    img{
        height: 100vh;
        width: 100vw;
    }
</style>
<body>
     
    <div id="animal"></div>
</body>
<script>
    let images = ["a1.jpg","a2.jpg","a4.webp","a5.webp","a6.webp"];
    //document.getElementsByTagName("div")[0].innerHtml = `<img src="${images[0]}" alt="">`;
    let i = 0;
    function execute(){
        document.getElementById("animal").innerHTML = `<img src="${images[i]}" alt="">`;
        i++;
        if(i == images.length) i = 0;
        console.log("hello");
        
    }
    setInterval(execute,3000);
</script>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation 5</title>
</head>
<style>
    body{
        background-color: rgb(165, 165, 227);
    }

    #btn{
        background-color: green;
        color: white;
        padding: 10px 15px;
        border-radius: 5px;
        border: 2px solid black;
        align-items: center;
        margin-left: 30px;
        box-shadow:  2px 2px 5px rgb(9, 9, 68);
    }
    #btn:hover{
         background-color: rgb(88, 220, 88);
        color: black;
    }

    #box{
        background-color: rgb(9, 9, 68);
        height: 150px;
        width: 150px;
        position: absolute; 
        box-shadow:  2px 2px 5px rgb(9, 9, 68);
    }
</style>
<body>
    <button id="btn" onclick="move()">Move</button><br><br>
    <div id="box"></div>
</body>
<script>
    let box = document.getElementById("box");
    
    function move(){
        let x = 100;
        let r = 2;
        let z = 150;
        let size = 1;
        let opacity = 0.1;
        interval =  setInterval(() =>{
           box.style.top = x+"px";
           box.style.left = x+"px";
           box.style.borderRadius = r +"%";
           box.style.opacity = opacity; 
           box.style.height = z + "px";
           box.style.width = z + "px";
           x += 10;
           r +=  r == 50? 0 : 1;
          opacity += opacity >= 1? 0 : 0.1;
          z += z == 50? 0: -2;
           if(x > 500)
           {
                clearInterval(interval);
           } 
        },100)
    }
</script>
</html>

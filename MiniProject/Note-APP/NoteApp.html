<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note APP</title>
</head>
<style>
    body{
        background:radial-gradient(purple,blue);
    }
   
    .upper{
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }



    h3,label{
        color: white;
        text-align: center;
    }
    
    #contentpage{
        color: white; 
        font-size: x-large;
         border: 2px solid white;
         padding: 10px;
         display: flex;
        gap: 3px;
        flex-wrap: wrap;
         grid-template-rows: auto;
   
    }
    .add{
        background-color: rgb(219, 16, 114);
        color: white;
        margin-left: 100px;
        border: 2px solid black;
        border-radius: 5px;
        height: 40px;
        width: 100px;
        box-shadow: 3px 3px 1px black;
        font-weight: bold;
        transition : transform 0.2s;
    }
    .add:hover{
        font-weight: 1000;
        margin-bottom: 20px;
        transform: scale(1.05);
    }
    input{
        height: 30px;
        width: 200px;
        border-radius: 10px;
        font-weight: bold;
        border: 2px solid black;
    }
    textarea{
        width: 200px;
        border-radius: 10px;
        font-weight: bold;
        color: black;
    }
    label{
        font-size: 1.2em;
    }
    .edit,.star{
        height: 40px;
        padding: 10px;
        font-weight: bold;
        border-radius: 5px;
        box-shadow: 1px 1px 1px green;
        border: 1px solid black;
        transition : transform 0.2s;
    }
    .edit:hover,.star:hover{
        
        text-align: center;
       
        transform: scale(1.06);
    }
    #warn{
        color: red;
    }
    .del-img,.star-img,.edit-img{
        height: 20px;
        width: 20px; 
        background-color: black;
    }
    .c-page{
        border: 2px solid black;
        padding: 5px 20px 20px 20px;
        background-color: rgb(6, 6, 58);
       overflow: hidden;
       width: 200px;
       height: 200px;
    }
</style>
<body>
    <div class="upper"> 
        <div>
            <h3>Note App</h3>
            <div>
                <legend style="color: white;">ADD NOTE</legend>
                <label for="title">title &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; </label><input type="text" name="title" id="title" placeholder="title here &rarr;"> <br><br>
                <label for="content">Content </label> <textarea name="content" id="content" placeholder="Content here "></textarea><br><br>
                <div id="formbtn">
                    <button id="edit" class="add" onclick="add()">ADD</button>
                </div>
            </div>
        </div> 
    </div> 
    <center><p id="warn"></p></center>
    <div id="contentpage"></div> 
</body>
<script>
    let notes = [{
        title :"Java",
        description : "Platform Independence",
        star : false,
    },{
        title: "Python",
        description : "Machine Learning",
        star : false
    },
    ];
    function addSomething(){
       document.getElementById("contentpage").innerHTML = "";
        for(let i = 0;i<notes.length;i++)
        {
            document.getElementById("contentpage").innerHTML += `<div class = "c-page"><h2 style = "text-align : center" >${notes[i].title}</h2> 
            <p style = "text-align : center";>${notes[i].description}</p> 
            <center style = "width :100%">
            <button onclick = "del(${i})"><img class = "del-img" src="delete.png" alt="del"></button> 
            <button onclick = "edit(${i})"><img class = "edit-img" src="edit.png" alt="edit"></button>
            <button onclick = "star(${i})"><img class = "star-img" src="${!notes[i].star ? "like.png" : "liked.png"}" alt=""></button>
            </center>
            </div> <br>`;
        }

    }
    addSomething()

    function add(){
        let x = document.getElementById("title").value;
        let y = document.getElementById("content").value;
        if( x == '' || y == '') {
            document.getElementById("warn").innerHTML = "Please enter title and description";
            return;
        }
        notes.push({title : x, description : y, star : false});
        addSomething();
        document.getElementById("title").value = " ";
        document.getElementById("content").value = " ";
    }

    function del(index){
        let temp = [];
        let j = 0;
        for(let i = 0;i<notes.length;i++)
        {
            if(i!=index)
            {
                temp[j++] = notes[i];
            }
        }
        notes = temp;
        addSomething();
    }
 
    function edit(index)
    {
        document.getElementById("title").value = notes[index].title;
        document.getElementById("content").value = notes[index].description;
        document.getElementById("formbtn").innerHTML = `<center><button onclick = "update(${index})">Edit</button></center>`;
    }

    function update(i)
    {
        notes[i].title = document.getElementById("title").value;
        notes[i].description = document.getElementById("content").value;
        document.getElementById("formbtn").innerHTML = `<button id="edit" class="add" onclick="add()">ADD</button>`;
        addSomething();
        document.getElementById("title").value = " ";
        document.getElementById("content").value = " ";
    }   

    function star(i)
    {
        notes[i].star = !notes[i].star;
        addSomething();
    }
</script>
</html>
